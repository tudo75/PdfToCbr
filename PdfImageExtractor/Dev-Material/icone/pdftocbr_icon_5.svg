<?xml version="1.0" encoding="UTF-8"?>
<!-- pdftocbr-icon.svg - stile astratto, senza frecce, con simboli di trasformazione -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="pdftocbr abstract icon">
  <defs>
    <style>
      .shadow { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)); }
    </style>
  </defs>

  <!-- sfondo arrotondato -->
  <rect x="32" y="32" width="448" height="448" rx="40" fill="#111" stroke="#333" stroke-width="3"/>

  <!-- Blocco PDF minimal -->
  <g transform="translate(60,90)" class="shadow">
    <rect x="0" y="0" width="170" height="230" rx="14" fill="#1f1f1f" stroke="#555" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="44" rx="10" fill="#c0392b"/>

    <!-- forma astratta "contenuto pdf" (3 rettangoli sfalsati) -->
    <rect x="28" y="70" width="114" height="14" rx="6" fill="#444"/>
    <rect x="28" y="100" width="114" height="14" rx="6" fill="#555"/>
    <rect x="28" y="130" width="114" height="14" rx="6" fill="#666"/>
  </g>

  <!-- Trasformazione astratta: dischi concentrici + deformazione a onda -->
  <g transform="translate(240,160)" class="shadow">
    <!-- Cerchi concentrici → rappresentano "processo" -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="#666" stroke-width="10"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#aaa" stroke-width="10"/>
    <circle cx="60" cy="60" r="16" fill="#ddd"/>

    <!-- onda che attraversa i cerchi → simbolo più astratto di conversione -->
    <path d="M0 60 C20 40, 40 80, 60 60 C80 40, 100 80, 120 60" fill="none" stroke="#eee" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Blocco CBR astratto -->
  <g transform="translate(350,110)" class="shadow">
    <rect x="0" y="0" width="120" height="180" rx="20" fill="#2b2b2b" stroke="#555" stroke-width="2"/>

    <!-- Pagine astratte "rilegatura curva" -->
    <path d="M20 40 C50 20, 70 20, 100 40" fill="none" stroke="#888" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 80 C50 60, 70 60, 100 80" fill="none" stroke="#777" stroke-width="8" stroke-linecap="round"/>
    <path d="M20 120 C50 100, 70 100, 100 120" fill="none" stroke="#666" stroke-width="8" stroke-linecap="round"/>
  </g>

</svg>