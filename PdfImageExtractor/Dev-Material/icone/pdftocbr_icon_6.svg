<?xml version="1.0" encoding="UTF-8"?>
<!-- pdftocbr-icon.svg - PDF diviso in due: in alto a sinistra PDF, in basso a destra CBR -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" aria-label="pdftocbr split icon">
  <defs>
    <style>
      .shadow { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)); }
    </style>
  </defs>

  <!-- sfondo arrotondato -->
  <rect x="32" y="32" width="448" height="448" rx="40" fill="#111" stroke="#333" stroke-width="3"/>

  <!-- Documento diviso in diagonale -->
  <g transform="translate(100,80)" class="shadow">
    <!-- Forma generale del documento -->
    <rect x="0" y="0" width="300" height="350" rx="22" fill="#1f1f1f" stroke="#555" stroke-width="2"/>

    <!-- Divisione diagonale -->
    <clipPath id="clip-pdf">
      <path d="M0 0 L300 0 L0 350 Z"/>
    </clipPath>
    <clipPath id="clip-cbr">
      <path d="M300 350 L300 0 L0 350 Z"/>
    </clipPath>

    <!-- Parte PDF (alto sinistra) -->
    <g clip-path="url(#clip-pdf)">
      <rect x="0" y="0" width="300" height="350" fill="#2a2a2a"/>
      <rect x="0" y="0" width="300" height="60" rx="10" fill="#c0392b"/>
      <rect x="40" y="100" width="180" height="16" rx="6" fill="#555"/>
      <rect x="40" y="140" width="180" height="16" rx="6" fill="#666"/>
      <rect x="40" y="180" width="180" height="16" rx="6" fill="#777"/>
    </g>

    <!-- Parte CBR (basso destra) -->
    <g clip-path="url(#clip-cbr)">
      <rect x="0" y="0" width="300" height="350" fill="#222"/>
      <!-- onde curve stilizzate per rappresentare pagine tipo fumetto/CBR -->
      <path d="M40 220 C80 200, 140 200, 180 220" fill="none" stroke="#999" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 260 C80 240, 140 240, 180 260" fill="none" stroke="#888" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 300 C80 280, 140 280, 180 300" fill="none" stroke="#777" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

</svg>