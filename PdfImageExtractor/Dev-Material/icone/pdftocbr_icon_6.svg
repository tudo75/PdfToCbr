     y="1.7028825"
     width="508.59424"
     height="508.59424"
     rx="45.410202"
     fill="#111111"
     stroke="#333333"
     stroke-width="3.40577"
     id="rect1" />
  <!-- Documento diviso in diagonale -->
  <g
     transform="matrix(1.135255,0,0,1.135255,78.900221,56.195122)"
     class="shadow"
     id="g11">
    <!-- Forma generale del documento -->
    <rect
       x="0"
       y="0"
       width="300"
       height="350"
       rx="22"
       fill="#1f1f1f"
       stroke="#555555"
       stroke-width="2"
       id="rect2" />
    <!-- Divisione diagonale -->
    <clipPath
       id="clip-pdf">
      <path
         d="M 0,0 H 300 L 0,350 Z"
         id="path2" />
    </clipPath>
    <clipPath
       id="clip-cbr">
      <path
         d="M 300,350 V 0 L 0,350 Z"
         id="path3" />
    </clipPath>
    <!-- Parte PDF (alto sinistra) -->
    <g
       clip-path="url(#clip-pdf)"
       id="g7">
      <rect
         x="0"
         y="0"
         width="300"
         height="350"
         fill="#2a2a2a"
         id="rect3" />
      <rect
         x="0"
         y="0"
         width="300"
         height="60"
         rx="10"
         fill="#c0392b"
         id="rect4" />
      <rect
         x="40"
         y="100"
         width="180"
         height="16"
         rx="6"
         fill="#555555"
         id="rect5" />
      <rect
         x="40"
         y="140"
         width="180"
         height="16"
         rx="6"
         fill="#666666"
         id="rect6" />
      <rect
         x="40"
         y="180"
         width="180"
         height="16"
         rx="6"
         fill="#777777"
         id="rect7" />
    </g>
    <!-- Parte CBR (basso destra) -->
    <g
       clip-path="url(#clip-cbr)"
       id="g10">
      <rect
         x="0"
         y="0"
         width="300"
         height="350"
         fill="#222222"
         id="rect8" />
      <!-- onde curve stilizzate per rappresentare pagine tipo fumetto/CBR -->
      <path
         d="m 40,220 c 40,-20 100,-20 140,0"
         fill="none"
         stroke="#999999"
         stroke-width="10"
         stroke-linecap="round"
         id="path8" />
      <path
         d="m 40,260 c 40,-20 100,-20 140,0"
         fill="none"
         stroke="#888888"
         stroke-width="10"
         stroke-linecap="round"
         id="path9" />
      <path
         d="m 40,300 c 40,-20 100,-20 140,0"
         fill="none"
         stroke="#777777"
         stroke-width="10"
         stroke-linecap="round"
         id="path10" />
    </g>
